name: Update end of life data

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Fetch data from endoflife.date
        run: php scripts/fetch-eol.php

      # Commit only when the data changed, so Netlify only rebuilds then.
      # Committing through the API with a personal token makes a signed commit
      # from an allowed pusher, which master's branch protection requires.
      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.EOL_PUSH_TOKEN }}
        run: |
          if git diff --quiet content/data/eol.json; then
            echo "No changes"
            exit 0
          fi
          gh api --method PUT "repos/${{ github.repository }}/contents/content/data/eol.json" \
            -f message="Update end of life data" \
            -f content="$(base64 -w0 content/data/eol.json)" \
            -f sha="$(git rev-parse HEAD:content/data/eol.json)" \
            -f branch=master \
            --jq '.commit.html_url'
